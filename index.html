<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>편지지</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #fde8ed; /* 전체 배경 핑크색 */
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Apple SD Gothic Neo', sans-serif;
      overflow: hidden;
    }

    /* 하트가 떨어지는 배경 영역 */
    #bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* 하트 애니메이션 */
    .heart {
      position: absolute;
      top: -30px;
      color: #ff5c8a;
      user-select: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh);
        opacity: 0.2;
      }
    }

    /* 가운데 흰색 편지 카드 */
    .card {
      position: relative;
      width: 85%;
      max-width: 320px;
      height: 75vh;
      background-color: #ffffff;
      border-radius: 25px;
      box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      z-index: 1;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      color: #aae0e6; /* 신비로운 민트-파란빛 글씨 */
      text-shadow: 0 0 8px rgba(170, 224, 230, 0.8);
      margin-bottom: 30px;
    }

    .subtitle {
      font-size: 14px;
      color: #b0e0e6;
      margin-top: -20px;
      margin-bottom: 30px;
    }

    /* 편지 봉투 디자인 */
    .envelope {
      width: 180px;
      height: 110px;
      background-color: #fca3b7;
      border-radius: 8px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 25px;
      cursor: pointer;
    }

    /* 봉투 접힌 부분 */
    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 90px solid transparent;
      border-right: 90px solid transparent;
      border-top: 60px solid #f98ca6;
    }

    /* 봉투 하트 스티커 */
    .sticker {
      position: absolute;
      width: 30px;
      height: 30px;
      background-color: #ff3b6b;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 14px;
      z-index: 2;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .main-text {
      font-size: 20px;
      font-weight: bold;
      color: #d6336c;
      margin-bottom: 8px;
    }

    .sub-text {
      font-size: 12px;
      color: #a0a0a0;
    }
  </style>
</head>
<body>

  <!-- 하트 내리는 배경 -->
  <div id="bg"></div>

  <!-- 가운데 편지지 카드 -->
  <div class="card">
    <div class="title">편지지 만드는방법!</div>
    <div class="subtitle">(어려워요우..)</div>

    <div class="envelope">
      <div class="sticker">♥</div>
    </div>

    <div class="main-text">편지당? 💌</div>
    <div class="sub-text">봉투 눌러서 열영</div>
  </div>

  <script>
    const bg = document.getElementById('bg');

    // 하트 내리는 효과 (원본 코드 그대로 적용)
    for (let i = 0; i < 40; i++) {
      const heart = document.createElement('div');
      heart.classList.add('heart');

      heart.textContent = '♥';
      heart.style.left = `${Math.random() * 100}vw`;
      heart.style.fontSize = `${12 + Math.random() * 18}px`;
      heart.style.animationDuration = `${6 + Math.random() * 7}s`;
      heart.style.animationDelay = `${-Math.random() * 10}s`;
      
      bg.appendChild(heart);
    }
  </script>

</body>
</html>
