<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마음을 전하는 편지</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #fde8ed;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Apple SD Gothic Neo', sans-serif;
      overflow: hidden;
    }

    /* 하트 배경 */
    #bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .heart-fall {
      position: absolute;
      top: -30px;
      color: #ff5c8a;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(105vh); opacity: 0.2; }
    }

    /* 카드 틀 */
    .card {
      position: relative;
      width: 85%;
      max-width: 330px;
      height: 75vh;
      max-height: 580px;
      background-color: #ffffff;
      border-radius: 25px;
      box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px 20px;
      text-align: center;
      z-index: 1;
    }

    /* 단계별 화면 전환 */
    .step {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .step.active {
      display: flex;
    }

    /* 텍스트 스타일 */
    .title-large {
      font-size: 26px;
      font-weight: bold;
      color: #e64a19;
      margin-bottom: 12px;
    }

    .title-pink {
      font-size: 22px;
      font-weight: bold;
      color: #d6336c;
      margin-bottom: 10px;
    }

    .sub-text {
      font-size: 15px;
      color: #666;
      margin-bottom: 25px;
    }

    .small-hint {
      font-size: 12px;
      color: #999;
      margin-top: 15px;
    }

    /* 분홍색 원형 하트 버튼 */
    .btn-circle-heart {
      width: 110px;
      height: 110px;
      background-color: #f76b8a;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(247, 107, 138, 0.4);
      transition: transform 0.2s;
    }

    .btn-circle-heart:active {
      transform: scale(0.92);
    }

    /* 편지 봉투 버튼 */
    .envelope {
      width: 190px;
      height: 120px;
      background-color: #fca3b7;
      border-radius: 10px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      margin: 20px 0;
    }

    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 95px solid transparent;
      border-right: 95px solid transparent;
      border-top: 65px solid #f98ca6;
    }

    .sticker {
      position: absolute;
      width: 32px;
      height: 32px;
      background-color: #ff3b6b;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 14px;
      z-index: 2;
    }

    /* 선택 버튼 영역 */
    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .btn-yes {
      background-color: #f76b8a;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-no {
      background-color: #e0e0e0;
      color: #666;
      border: none;
      padding: 12px 28px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 빨간 하트 에모지 큰것 */
    .big-emoji {
      font-size: 70px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div id="bg"></div>

  <div class="card">
    <!-- 1단계: 안뇽! -->
    <div class="step active" id="step1">
      <div class="title-large" style="color: #f76b8a;">안뇽! 💗</div>
      <div class="sub-text">누구누구야!</div>
      <div class="btn-circle-heart" onclick="nextStep(2)">♥</div>
      <div class="small-hint">하트를 눌러봐 💓</div>
    </div>

    <!-- 2단계: 편지당? -->
    <div class="step" id="step2">
      <div class="envelope" onclick="nextStep(3)">
        <div class="sticker">♥</div>
      </div>
      <div class="title-pink">편지당? ✉️</div>
      <div class="sub-text">봉투 눌러서 열엉</div>
    </div>

    <!-- 3단계: 나 사랑하쥐?? -->
    <div class="step" id="step3">
      <div class="title-large" style="color: #c2185b;">나 사랑하쥐?? 🥺</div>
      <div class="btn-group">
        <button class="btn-yes" onclick="nextStep(5)">응! ❤️</button>
        <button class="btn-no" onclick="nextStep(4)">아니??</button>
      </div>
      <div class="small-hint" style="margin-top: 30px;">잘 생각해봐... 📑</div>
    </div>

    <!-- 4단계: 거절 시 나오는 화면 -->
    <div class="step" id="step4">
      <div class="title-large" style="color: #c2185b;">나 사랑하쥐?? 🥺</div>
      <div class="btn-group">
        <button class="btn-yes" style="padding: 14px 50px;" onclick="nextStep(5)">응! ❤️</button>
      </div>
      <div class="small-hint" style="margin-top: 30px;">한 번만 다시 생각해봐... 🥺</div>
    </div>

    <!-- 5단계: 헤헷 나더 사랑해 -->
    <div class="step" id="step5">
      <div class="title-large" style="color: #c2185b;">헤헷 나더 누구 사랑해 ❤️</div>
      <div class="sub-text">누구누구얌 사랑햄</div>
      <div class="btn-circle-heart" onclick="nextStep(6)">♥</div>
      <div class="small-hint">하트를 눌러 💓</div>
    </div>

    <!-- 6단계: 누구 요즘 뭐뭐해 -->
    <div class="step" id="step6">
      <div class="sub-text" style="font-size: 18px; color: #444; margin-bottom: 20px;">
        누구 요즘 뭐뭐해<br>하트 눌러봐랏
      </div>
      <div class="btn-circle-heart" onclick="nextStep(7)">♥</div>
      <div class="small-hint">눌러랏——</div>
    </div>

    <!-- 7단계: 하잇! 편지 내용 -->
    <div class="step" id="step7">
      <div class="big-emoji">❤️</div>
      <div class="title-large" style="color: #c2185b;">하잇!</div>
      <div class="sub-text" style="line-height: 1.6; color: #555; word-break: keep-all; margin-top: 10px;">
        할말은없엉ㅎㅎ 그냥 사랑한다고 전하고 싶더라구 사랑햄 💓
      </div>
    </div>
  </div>

  <script>
    // 배경 하트 흩날리는 효과
    const bg = document.getElementById('bg');
    for (let i = 0; i < 35; i++) {
      const heart = document.createElement('div');
      heart.classList.add('heart-fall');
      heart.textContent = '♥';
      heart.style.left = `${Math.random() * 100}vw`;
      heart.style.fontSize = `${12 + Math.random() * 18}px`;
      heart.style.animationDuration = `${6 + Math.random() * 7}s`;
      heart.style.animationDelay = `${-Math.random() * 10}s`;
      bg.appendChild(heart);
    }

    // 화면 전환 함수
    function nextStep(stepNumber) {
      const steps = document.querySelectorAll('.step');
      steps.forEach(step => step.classList.remove('active'));
      
      const targetStep = document.getElementById(`step${stepNumber}`);
      if (targetStep) {
        targetStep.classList.add('active');
      }
    }
  </script>

</body>
</html>
